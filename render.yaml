# KORA — Render blueprint
# Deploy from the Render dashboard: New > Blueprint (use this file), or
# New > Web Service > connect this repo, then:
#   Build Command:  npm install && npm run build
#   Start Command:  npm start
services:
  - type: web
    name: kora
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: KORA_HOST
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false